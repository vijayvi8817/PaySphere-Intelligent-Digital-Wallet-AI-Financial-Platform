version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paysphere-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paysphere}
      POSTGRES_USER: ${POSTGRES_USER:-paysphere_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paysphere_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paysphere-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paysphere_admin} -d ${POSTGRES_DB:-paysphere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paysphere-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-paysphere_redis}
    volumes:
      - redis_data:/data
    networks:
      - paysphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-paysphere_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  paysphere-network:
    driver: bridge
